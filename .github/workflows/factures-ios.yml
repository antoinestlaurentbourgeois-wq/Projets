name: Mes factures (iOS)

on:
  push:
    paths: ['accompagnement-factures/**', '.github/workflows/factures-ios.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: accompagnement-factures
    steps:
      - uses: actions/checkout@v4
      - name: Installer XcodeGen
        run: brew install xcodegen
      - name: Générer le projet Xcode
        run: xcodegen generate
      - name: Compiler l'app pour iPhone (non signée)
        run: |
          mkdir -p ../out
          set -o pipefail
          xcodebuild -project MesFactures.xcodeproj -scheme Factures -sdk iphoneos -configuration Release \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build 2>&1 | tee ../out/build.log | grep -E "error:|warning: .*Sources|BUILD|\*\*" | head -n 60
          mkdir -p Payload && cp -R build/Build/Products/Release-iphoneos/Factures.app Payload/
          zip -qr ../out/MesFactures-non-signee.ipa Payload
      - name: Choisir un simulateur iPhone
        id: sim
        run: |
          xcrun simctl list runtimes
          xcrun simctl list devices available | head -n 40
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next((x['udid'] for k,v in sorted(d.items(), reverse=True) if 'iOS' in k for x in v if 'iPhone' in x['name']), ''))")
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "Simulateur : $UDID"
      - name: Tests
        if: steps.sim.outputs.udid != ''
        run: |
          set -o pipefail
          SIMCTL_CHILD_PDF_OUT="$GITHUB_WORKSPACE/out" xcodebuild test \
            -project MesFactures.xcodeproj -scheme Factures \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee ../out/test.log | grep -E "error:|Test Case.*(passed|failed)|Executed|TEST (SUCCEEDED|FAILED)|\*\*" | head -n 80
      - name: Publier les exemples de PDF et le projet Xcode
        if: github.ref_type == 'branch'
        run: |
          mkdir -p docs
          cp ../out/exemple-facture*.pdf docs/ || true
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add docs MesFactures.xcodeproj
          git diff --cached --quiet || (git commit -m "CI : exemples de factures PDF et projet Xcode généré" && git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME")
      - uses: actions/upload-artifact@v4
        with:
          name: MesFactures
          path: out/

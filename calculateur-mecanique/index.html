<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MécaCalc — Calculateur d'ingénierie mécanique</title>
<meta name="description" content="Calculateurs d'ingénierie mécanique : poutres, assemblages boulonnés, flambage, hydraulique, soudures et sélection de moteurs.">
<style>
:root{
  --bg:#f3f5f9; --panel:#ffffff; --panel2:#f7f9fc; --border:#e2e7ef; --border2:#cfd7e3;
  --text:#0f172a; --muted:#566275; --faint:#8b95a7;
  --accent:#2457d6; --accent-soft:#e9effd; --accent-text:#1d47b3;
  --c1:#2457d6; --c2:#e0671b; --c3:#0e9384; --c4:#8b5cf6;
  --ok:#157f3b; --ok-soft:#e5f5ea; --warn:#a16207; --warn-soft:#fdf4dc; --bad:#c62828; --bad-soft:#fdeaea;
  --grid:#edf0f5; --axis:#a3adbd; --steel:#c9d2df; --steel2:#aab5c6; --weld:#e0671b;
  --shadow:0 1px 2px rgba(15,23,42,.04),0 6px 20px -8px rgba(15,23,42,.10);
  --radius:14px;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0c1118; --panel:#131a24; --panel2:#18212d; --border:#233041; --border2:#2f3e52;
    --text:#e6ebf2; --muted:#9aa7b8; --faint:#6d7a8c;
    --accent:#6f9bff; --accent-soft:#1b2a45; --accent-text:#9dbbff;
    --c1:#6f9bff; --c2:#ff9950; --c3:#34c6b2; --c4:#b69bff;
    --ok:#4ccf7c; --ok-soft:#12291c; --warn:#f2bf4a; --warn-soft:#2c2412; --bad:#ff6b6b; --bad-soft:#2f1618;
    --grid:#1e2835; --axis:#4a5a70; --steel:#3b4a5e; --steel2:#56677e; --weld:#ff9950;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -10px rgba(0,0,0,.5);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0c1118; --panel:#131a24; --panel2:#18212d; --border:#233041; --border2:#2f3e52;
  --text:#e6ebf2; --muted:#9aa7b8; --faint:#6d7a8c;
  --accent:#6f9bff; --accent-soft:#1b2a45; --accent-text:#9dbbff;
  --c1:#6f9bff; --c2:#ff9950; --c3:#34c6b2; --c4:#b69bff;
  --ok:#4ccf7c; --ok-soft:#12291c; --warn:#f2bf4a; --warn-soft:#2c2412; --bad:#ff6b6b; --bad-soft:#2f1618;
  --grid:#1e2835; --axis:#4a5a70; --steel:#3b4a5e; --steel2:#56677e; --weld:#ff9950;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -10px rgba(0,0,0,.5);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.5 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button,select,input{font:inherit;color:inherit}
sup{font-size:.7em;line-height:0}

/* ---------- Layout ---------- */
.app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;background:var(--panel);border-right:1px solid var(--border);padding:18px 14px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px}
.brand-logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--accent),#1c3f9e);display:grid;place-items:center;color:#fff;flex:none}
.brand b{display:block;font-size:16px;letter-spacing:-.01em}
.brand small{color:var(--faint);font-size:11.5px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav-lbl{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--faint);padding:14px 10px 6px}
.nav button{display:flex;align-items:center;gap:11px;width:100%;border:0;background:none;padding:9px 10px;border-radius:9px;cursor:pointer;color:var(--muted);font-weight:500;text-align:left}
.nav button:hover{background:var(--panel2);color:var(--text)}
.nav button.on{background:var(--accent-soft);color:var(--accent-text)}
.nav button svg{flex:none;width:19px;height:19px}
.nav .badge{margin-left:auto;font-size:11px;background:var(--panel2);border:1px solid var(--border);border-radius:99px;padding:0 7px;color:var(--muted)}
.side-foot{margin-top:auto;padding:12px 8px 0;border-top:1px solid var(--border);font-size:11.5px;color:var(--faint)}

main{min-width:0;padding:22px 28px 40px}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:18px}
.top h1{margin:0;font-size:24px;letter-spacing:-.02em;font-weight:700}
.top p{margin:4px 0 0;color:var(--muted);max-width:720px}
.top-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.seg{display:inline-flex;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:3px}
.seg button{border:0;background:none;padding:5px 12px;border-radius:7px;cursor:pointer;color:var(--muted);font-weight:500;font-size:13px}
.seg button.on{background:var(--accent);color:#fff}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--border);background:var(--panel);padding:7px 12px;border-radius:10px;cursor:pointer;font-weight:500;font-size:13px;white-space:nowrap}
.btn:hover{border-color:var(--border2);background:var(--panel2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.07)}
.btn.icon{padding:7px 9px}
.btn svg{width:16px;height:16px}

.layout{display:grid;grid-template-columns:minmax(300px,360px) minmax(0,1fr);gap:18px;align-items:start}
.app>*,.layout>*,.stack>*{min-width:0}
.col-in{position:sticky;top:18px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 18px 0}
.card-h h3{margin:0;font-size:13px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.card-b{padding:12px 18px 18px}
.stack{display:flex;flex-direction:column;gap:18px}

/* ---------- Inputs ---------- */
.inputs{max-height:calc(100vh - 36px);overflow:auto}
fieldset.grp{border:0;margin:0;padding:12px 18px 14px;border-top:1px solid var(--border)}
fieldset.grp:first-child{border-top:0}
fieldset.grp legend{float:left;width:100%;padding:0;margin:0 0 8px;font-size:12px;font-weight:600;color:var(--accent-text);text-transform:uppercase;letter-spacing:.07em}
fieldset.grp legend+*{clear:both}
.fld{display:block;margin-top:9px}
.fld .lbl{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--muted);margin-bottom:4px;font-weight:500}
.fld .sym{font-family:var(--mono);font-size:11.5px;color:var(--faint)}
.inp{display:flex;align-items:stretch;border:1px solid var(--border);border-radius:9px;background:var(--panel2);transition:border-color .12s,box-shadow .12s}
.inp:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);background:var(--panel)}
.inp.bad{border-color:var(--bad);box-shadow:0 0 0 3px var(--bad-soft)}
.inp input{flex:1;min-width:0;border:0;background:none;outline:0;padding:8px 10px;font-family:var(--mono);font-size:13.5px}
.inp .u{display:flex;align-items:center;padding:0 10px;color:var(--muted);font-size:12.5px;border-left:1px solid var(--border);white-space:nowrap;min-width:52px;justify-content:center}
.selw{position:relative}
.selw select{width:100%;appearance:none;border:1px solid var(--border);border-radius:9px;background:var(--panel2);padding:8px 32px 8px 10px;cursor:pointer;outline:0}
.selw select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.selw::after{content:"";position:absolute;right:13px;top:50%;width:7px;height:7px;border-right:1.6px solid var(--muted);border-bottom:1.6px solid var(--muted);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.hint{display:block;font-size:11.5px;color:var(--faint);margin-top:3px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}

/* ---------- Results ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent)}
.kpi.ok::before{background:var(--ok)} .kpi.warn::before{background:var(--warn)} .kpi.bad::before{background:var(--bad)}
.kpi .kl{font-size:12px;color:var(--muted);font-weight:500}
.kpi .kv{font-size:24px;font-weight:700;letter-spacing:-.02em;margin-top:2px;font-variant-numeric:tabular-nums;white-space:nowrap}
.kpi .kv.txt{white-space:normal;font-size:20px;line-height:1.25;margin-block:4px}
.kpi .kv .ku{font-size:13px;font-weight:500;color:var(--muted);margin-left:5px;letter-spacing:0}
.kpi .ks{font-size:12px;color:var(--faint);margin-top:1px}
.kpi.ok .kv{color:var(--ok)} .kpi.warn .kv{color:var(--warn)} .kpi.bad .kv{color:var(--bad)}

.checks{display:flex;flex-direction:column;gap:8px}
.chk{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border-radius:10px;font-size:13px}
.chk .dot{flex:none;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:12px;font-weight:700;margin-top:0}
.chk.ok{background:var(--ok-soft)} .chk.ok .dot{background:var(--ok)}
.chk.warn{background:var(--warn-soft)} .chk.warn .dot{background:var(--warn)}
.chk.bad{background:var(--bad-soft)} .chk.bad .dot{background:var(--bad)}
.chk.info{background:var(--accent-soft)} .chk.info .dot{background:var(--accent)}
.chk b{font-weight:600}

.util{display:flex;flex-direction:column;gap:11px;margin-top:4px}
.ut-row{display:grid;grid-template-columns:minmax(120px,1fr) 2fr 56px;gap:10px;align-items:center;font-size:12.5px}
.ut-row .ul{color:var(--muted)}
.ut-bar{height:8px;background:var(--panel2);border:1px solid var(--border);border-radius:99px;overflow:hidden;position:relative}
.ut-bar i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:var(--ok)}
.ut-bar i.warn{background:var(--warn)} .ut-bar i.bad{background:var(--bad)}
.ut-row .uv{text-align:right;font-family:var(--mono);font-weight:500}

.grid2{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:18px}
.schem svg{width:100%;height:auto;display:block}
.sk-steel{fill:var(--steel);stroke:var(--steel2);stroke-width:1.2}
.sk-line{stroke:var(--text);stroke-width:1.4;fill:none}
.sk-thin{stroke:var(--muted);stroke-width:1;fill:none}
.sk-dim{stroke:var(--faint);stroke-width:1;fill:none}
.sk-load{stroke:var(--c2);stroke-width:2;fill:none}
.sk-loadf{fill:var(--c2)}
.sk-acc{stroke:var(--c1);stroke-width:2;fill:none}
.sk-weld{fill:var(--weld);fill-opacity:.85;stroke:var(--weld)}
.sk-txt{fill:var(--text);font-size:13px;font-family:Inter,system-ui,sans-serif}
.sk-txt.m{fill:var(--muted);font-size:12px}
.sk-txt.l{fill:var(--c2);font-weight:600}
.sk-bg{fill:var(--panel2)}
.sk-hatch{stroke:var(--steel2);stroke-width:1}
.sk-oil{fill:var(--c1);fill-opacity:.14}

table.dt{width:100%;border-collapse:collapse;font-size:13px}
table.dt td{padding:7px 0;border-bottom:1px solid var(--border)}
table.dt tr:last-child td{border-bottom:0}
table.dt td:last-child{text-align:right;font-family:var(--mono);font-size:12.8px;white-space:nowrap}
table.dt td .u{color:var(--muted);font-family:Inter,system-ui,sans-serif;font-size:12px;margin-left:3px}
table.cand{width:100%;border-collapse:collapse;font-size:12.8px;font-variant-numeric:tabular-nums;white-space:nowrap}
table.cand th{text-align:right;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--border2)}
table.cand td{text-align:right;padding:7px 8px;border-bottom:1px solid var(--border);font-family:var(--mono);font-size:12.3px}
table.cand th:first-child,table.cand td:first-child{text-align:left;font-family:Inter,system-ui,sans-serif;font-size:13px}
table.cand tbody tr{cursor:pointer}
table.cand tbody tr:hover{background:var(--panel2)}
table.cand tbody tr:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
table.cand tr.sel{background:var(--accent-soft)!important}
table.cand tr.sel td:first-child{font-weight:600;color:var(--accent-text)}
table.cand td.ok{color:var(--ok)} table.cand td.warn{color:var(--warn)} table.cand td.bad{color:var(--bad)}
.pill{display:inline-block;padding:1px 8px;border-radius:99px;font-size:11px;font-weight:600;font-family:Inter,system-ui,sans-serif}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.bad{background:var(--bad-soft);color:var(--bad)}
.scroll-x{overflow-x:auto}
table.dt td small{display:block;color:var(--faint);font-size:11.5px;font-family:Inter,system-ui,sans-serif}
table.dt .th td{padding-top:14px;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--accent-text);font-weight:600;border-bottom:1px solid var(--border2)}
table.dt .th:first-child td{padding-top:2px}
.tables{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:0 28px;align-items:start}
table.dt .th td{text-align:left;font-family:Inter,system-ui,sans-serif}

.charts{display:grid;grid-template-columns:1fr;gap:6px}
.chart-t{font-size:13px;font-weight:600;margin:6px 0 2px;display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.chart-t span{font-weight:400;color:var(--faint);font-size:12px}
.chart{position:relative;width:100%}
.chart svg{display:block;overflow:visible;max-width:100%;height:auto}
.chart .grid{stroke:var(--grid);stroke-width:1}
.chart .zero{stroke:var(--axis);stroke-width:1}
.chart .frame{stroke:var(--border2);fill:none}
.chart .tk{fill:var(--faint);font-size:11px;font-family:var(--mono)}
.chart .al{fill:var(--muted);font-size:11.5px}
.chart .ln{fill:none;stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
.chart .ar{stroke:none;opacity:.13}
.chart .hl{stroke-width:1.3;stroke-dasharray:5 4;fill:none}
.chart .hlt{font-size:11px;font-weight:500}
.chart .mk{stroke:var(--panel);stroke-width:2}
.chart .mkt{font-size:11.5px;font-weight:600;fill:var(--text);paint-order:stroke;stroke:var(--panel);stroke-width:3px}
.chart .hov-x{stroke:var(--axis);stroke-width:1;stroke-dasharray:3 3;display:none}
.chart .hov-dot{stroke:var(--panel);stroke-width:2;display:none}
.chart .tip{position:absolute;pointer-events:none;background:var(--panel);border:1px solid var(--border2);box-shadow:var(--shadow);border-radius:9px;padding:7px 10px;font-size:12px;display:none;white-space:nowrap;z-index:5}
.chart .tip b{font-family:var(--mono);font-weight:500}
.chart .tip .sw{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:2px 0 0}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:6px;vertical-align:3px}
.legend i.d{background:none!important;border-top:2px dashed;height:0}

.notes{margin:0;padding-left:18px;color:var(--muted);font-size:13px}
.notes li{margin:4px 0}
.formulas{display:flex;flex-wrap:wrap;gap:8px;margin:2px 0 14px}
.formulas code{font-family:var(--mono);font-size:12.3px;background:var(--panel2);border:1px solid var(--border);padding:4px 9px;border-radius:7px}
.err{padding:14px 18px;border-radius:var(--radius);background:var(--bad-soft);color:var(--bad);border:1px solid var(--bad);font-weight:500}
.err ul{margin:4px 0 0;padding-left:18px;font-weight:400}

/* ---------- History ---------- */
.hist-tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.hist-tools .selw{min-width:200px}
.hist{display:flex;flex-direction:column;gap:10px}
.he{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding:14px 16px}
.he .tag{font-size:11.5px;font-weight:600;padding:4px 9px;border-radius:99px;background:var(--accent-soft);color:var(--accent-text);white-space:nowrap}
.he .when{font-size:12px;color:var(--faint)}
.he .sum{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:12.8px;margin-top:3px}
.he .sum span{color:var(--muted)}
.he .sum b{font-family:var(--mono);font-weight:500;color:var(--text)}
.he .acts{display:flex;gap:6px}
.empty{text-align:center;padding:48px 20px;color:var(--muted)}
.empty svg{width:40px;height:40px;color:var(--faint);margin-bottom:8px}

.toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,20px);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:500;opacity:0;transition:.2s;pointer-events:none;z-index:50;max-width:calc(100vw - 32px)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.foot{margin-top:26px;font-size:12px;color:var(--faint);text-align:center}

/* ---------- Responsive ---------- */
@media (max-width:1180px){ .grid2{grid-template-columns:1fr} }
@media (max-width:980px){
  .layout{grid-template-columns:1fr}
  .col-in{position:static}
  .inputs{max-height:none}
}
@media (max-width:780px){
  .app{grid-template-columns:1fr}
  .side{position:sticky;top:0;height:auto;z-index:20;flex-direction:row;align-items:center;padding:8px 12px;gap:8px;border-right:0;border-bottom:1px solid var(--border);overflow-x:auto}
  .brand{padding:0 6px 0 0}
  .brand div{display:none}
  .nav{flex-direction:row}
  .nav-lbl,.side-foot{display:none}
  .nav button{padding:7px 10px;white-space:nowrap}
  main{padding:16px 16px 32px}
  .top{flex-direction:column}
  .top-actions{justify-content:flex-start}
  .top h1{font-size:20px}
  .kpi .kv{font-size:20px}
  .he{grid-template-columns:1fr}
  .ut-row{grid-template-columns:1fr 1.4fr 50px}
}
@media print{
  .side,.top-actions,.col-in .card-h .btn{display:none}
  .app{grid-template-columns:1fr} .layout{grid-template-columns:1fr} .col-in{position:static}
  .inputs{max-height:none}
  body{background:#fff}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <div class="brand-logo"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M2 12h3M19 12h3M4.9 19.1 7 17M17 7l2.1-2.1"/></svg></div>
      <div><b>MécaCalc</b><small>Ingénierie mécanique</small></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">Unités : SI / impérial<br>Calcul instantané · données locales</div>
  </aside>
  <main>
    <header class="top">
      <div><h1 id="title"></h1><p id="desc"></p></div>
      <div class="top-actions">
        <div class="seg" id="units" role="group" aria-label="Système d'unités">
          <button data-u="si">Métrique (SI)</button><button data-u="imp">Impérial</button>
        </div>
        <button class="btn icon" id="theme" title="Changer de thème" aria-label="Changer de thème"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
      </div>
    </header>
    <section id="view"></section>
    <div class="foot">Outil d'aide au calcul préliminaire — les résultats doivent être validés selon les normes applicables et par un ingénieur qualifié.</div>
  </main>
</div>
<div class="toast" id="toast"></div>

<script>
'use strict';
/* =========================================================================
   Utilitaires
   ========================================================================= */
const $ = (s, r = document) => r.querySelector(s);
const PI = Math.PI;
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },

        ['Couple d\'accélération T_a', E.Ta, 'mtorque'], ['T₁ accélération (× k)', E.T1, 'mtorque'], ['T₂ vitesse constante (× k)', E.T2, 'mtorque'], ['T₃ décélération (× k)', E.T3, 'mtorque'], ['T₄ arrêt (× k)', E.T4, 'mtorque'],
        ['Couple efficace T_rms', E.Trms, 'mtorque'], ['Puissance en régime', Prun, 'power'], ['Puissance crête', Ppk, 'power']] },
      { title: 'Moteur', rows: [['Puissance nominale', m.P, 'power'], ['Couple nominal', m.Tr, 'mtorque'], ['Couple maximal', m.Tmax, 'mtorque'], ['Inertie du rotor J_M', m.J, 'minertia'],
        ['Vitesse nominale', `${fmtNum(m.Nr, 4)}<span class="u">tr/min</span>`, null], ['Vitesse maximale', `${fmtNum(m.Nmax, 4)}<span class="u">tr/min</span>`, null], ['Temps de cycle', L.tcyc, 'time']] }
    ];
    R.formulas = ['J_L,M = J_L/i² + J_G', 'T_a = (J_M + J_L/η)·ω/t_a', 'T_L = F·r/(η·i·η_G)', 'T_rms = √(ΣT²·t / t_cycle)', 'N = v/(2π·r)·60·i'];
    R.schematic = motorSVG(s, s.i !== 1 || s.JG > 0);

    const t1 = L.ta, t2 = L.ta + L.tc, t3 = t2 + L.ta, t4 = L.tcyc, cT = v => conv(v, 'mtorque');
    const tu = unit('mtorque');
    R.charts = [
      { title: 'Profil de vitesse du moteur', sub: `N_max = ${fmtNum(L.N, 4)} tr/min`, o: { height: 180, xLabel: 'Temps (s)', xName: 't', xUnit: 's', yLabel: 'Vitesse (tr/min)', yZero: true,
        series: [{ name: 'Vitesse', unit: 'tr/min', color: 'var(--c1)', area: true, x: [0, t1, t2, t3, t4], y: [0, L.N, L.N, 0, 0] }] } },
      { title: 'Profil de couple du moteur', sub: `T_rms = ${valTxt(E.Trms, 'mtorque')}`, o: { height: 220, xLabel: 'Temps (s)', xName: 't', xUnit: 's', yLabel: `Couple (${tu})`, yZero: true,
        series: [{ name: 'Couple', unit: tu, color: 'var(--c2)', area: true, x: [0, 0, t1, t1, t2, t2, t3, t3, t4], y: [0, E.T1, E.T1, E.T2, E.T2, E.T3, E.T3, E.T4, E.T4].map(cT) }],
        hlines: [{ y: cT(E.Tpa), label: 'Couple max. disponible', color: 'var(--bad)' }, { y: cT(m.Tr), label: 'Couple nominal', color: 'var(--c3)' }] } },
      { title: 'Courbe couple-vitesse', sub: `${m.n} (courbe idéalisée)`, o: (() => {
        const Ns = linspace(0, m.Nmax, 160);
        return { height: 260, xLabel: 'Vitesse moteur (tr/min)', xName: 'N', xUnit: 'tr/min', yLabel: `Couple (${tu})`, yMin: 0, xMin: 0, xMax: Math.max(m.Nmax, L.N) * 1.05,
          series: [{ name: 'Zone intermittente (crête)', unit: tu, color: 'var(--c2)', area: true, x: Ns, y: Ns.map(N => cT(tPeak(m, N, ac))) },
                   { name: 'Zone continue', unit: tu, color: 'var(--c1)', area: true, x: Ns, y: Ns.map(N => cT(tCont(m, N, ac))) }],
          markers: [{ x: L.N, y: cT(E.Tpk), color: E.c.pk <= 1 ? 'var(--ok)' : 'var(--bad)', label: 'Crête' }, { x: Navg, y: cT(E.Trms), color: E.c.rms <= 1 ? 'var(--ok)' : 'var(--bad)', label: 'Efficace (vitesse moy.)', below: true }] };
      })() }
    ];
    R.summary = [{ l: 'Mécanisme', t: MECHS.find(x => x[0] === s.mech)[1] }, { l: 'Moteur', t: none ? 'aucun' : m.n }, { l: 'N', t: `${fmtNum(L.N, 4)} tr/min` },
      { l: 'T crête', v: E.Tpk, q: 'mtorque' }, { l: 'T rms', v: E.Trms, q: 'mtorque' }, { l: 'J_L/J_M', v: E.ratio, q: 'none' }];
    return R;
  }
};

/* =========================================================================
   Application
   ========================================================================= */
const MODS = [MOD_BEAM, MOD_BOLT, MOD_COL, MOD_HYD, MOD_WELD, MOD_MOTOR];
const MOD = Object.fromEntries(MODS.map(m => [m.id, m]));
const allFields = m => m.groups.flatMap(g => g.fields);
const defaults = m => Object.fromEntries(allFields(m).map(f => [f.id, f.def]));
function newRes() { return { errors: [], kpis: [], checks: [], util: [], tables: [], charts: [], formulas: [], summary: [], custom: [], schematic: '' }; }

const saved = store.get('mc.state', {});
const S = {};
MODS.forEach(m => { S[m.id] = Object.assign(defaults(m), saved[m.id] || {}); });
let HIST = store.get('mc.history', []);
if (!Array.isArray(HIST)) HIST = [];
let cur = store.get('mc.tab', 'beam');
if (!MOD[cur] && cur !== 'history') cur = 'beam';
let lastRes = null, histFilter = 'all';

const ICON_HIST = '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>';
function renderNav() {
  const b = (id, name, icon, extra = '') => `<button data-tab="${id}" class="${cur === id ? 'on' : ''}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${icon}</svg>${name}${extra}</button>`;
  $('#nav').innerHTML = '<div class="nav-lbl">Modules</div>' + MODS.map(m => b(m.id, m.name, m.icon)).join('') +
    '<div class="nav-lbl">Données</div>' + b('history', 'Historique', ICON_HIST, `<span class="badge">${HIST.length}</span>`);
}
$('#nav').addEventListener('click', e => {
  const t = e.target.closest('button[data-tab]'); if (!t) return;
  cur = t.dataset.tab; store.set('mc.tab', cur); renderNav(); renderView(); window.scrollTo({ top: 0 });
});
function renderUnits() { document.querySelectorAll('#units button').forEach(b => b.classList.toggle('on', b.dataset.u === SYS)); }
$('#units').addEventListener('click', e => {
  const b = e.target.closest('button[data-u]'); if (!b || b.dataset.u === SYS) return;
  SYS = b.dataset.u; store.set('mc.units', SYS); renderUnits(); renderView();
});
function applyTheme(t) { if (t) document.documentElement.setAttribute('data-theme', t); else document.documentElement.removeAttribute('data-theme'); }
applyTheme(store.get('mc.theme', null));
$('#theme').addEventListener('click', () => {
  const dark = document.documentElement.getAttribute('data-theme') ? document.documentElement.getAttribute('data-theme') === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  const t = dark ? 'light' : 'dark'; applyTheme(t); store.set('mc.theme', t);
  if (cur !== 'history') compute();
});

/* ---------- Vue module ---------- */
function renderView() {
  const v = $('#view');
  if (cur === 'history') { renderHistory(); return; }
  const m = MOD[cur];
  $('#title').textContent = m.name; $('#desc').textContent = m.desc;
  v.innerHTML = `<div class="layout">
    <div class="col-in"><div class="card inputs">
      <div class="card-h" style="padding-bottom:4px"><h3>Données d'entrée</h3>
        <button class="btn" id="reset" title="Rétablir les valeurs par défaut"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>Défaut</button></div>
      <div id="inputs"></div>
      <div style="padding:6px 18px 18px"><button class="btn primary" id="save" style="width:100%;justify-content:center"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 3h11l3 3v15H5z"/><path d="M8 3v5h8V3M8 21v-7h8v7"/></svg>Enregistrer dans l'historique</button></div>
    </div></div>
    <div class="stack" id="out"></div></div>`;
  renderInputs();
  const host = $('#inputs');
  host.addEventListener('input', onInput);
  host.addEventListener('change', onSelect);
  $('#reset').onclick = () => { S[cur] = defaults(m); renderInputs(); compute(); toast('Valeurs par défaut rétablies'); };
  $('#save').onclick = saveHistory;
  compute();
}
function fieldList() { return allFields(MOD[cur]); }
function renderInputs() {
  const m = MOD[cur], s = S[cur];
  $('#inputs').innerHTML = m.groups.map(g => {
    const fs = g.fields.filter(f => !f.when || f.when(s));
    return `<fieldset class="grp"><legend>${g.title}</legend>${fs.map(f => fieldHTML(f, s)).join('')}</fieldset>`;
  }).join('');
}
function fieldHTML(f, s) {
  const label = typeof f.label === 'function' ? f.label(s) : f.label, hint = typeof f.hint === 'function' ? f.hint(s) : f.hint;
  const sym = f.sym ? `<span class="sym">${esc(f.sym)}</span>` : '';
  if (f.type === 'sel') {
    const opts = typeof f.opts === 'function' ? f.opts(s) : f.opts;
    if (!opts.some(o => o[0] === s[f.id])) s[f.id] = opts[0][0];
    return `<label class="fld"><span class="lbl">${esc(label)}</span><div class="selw"><select data-id="${f.id}">${opts.map(([v, l]) => `<option value="${esc(v)}"${v === s[f.id] ? ' selected' : ''}>${esc(l)}</option>`).join('')}</select></div>${hint ? `<span class="hint">${esc(hint)}</span>` : ''}</label>`;
  }
  const u = unit(f.q);
  return `<label class="fld"><span class="lbl"><span>${esc(label)}</span>${sym}</span><div class="inp"><input data-id="${f.id}" type="text" inputmode="decimal" autocomplete="off" spellcheck="false" value="${dispVal(s[f.id], f.q)}" aria-label="${esc(label)}">${u ? `<span class="u">${u}</span>` : ''}</div>${hint ? `<span class="hint">${esc(hint)}</span>` : ''}</label>`;
}
function onInput(e) {
  const el = e.target; if (el.tagName !== 'INPUT') return;
  const f = fieldList().find(x => x.id === el.dataset.id), s = S[cur];
  const raw = el.value.trim().replace(/\s/g, '').replace(',', '.');
  const ok = /^[-+]?(\d+\.?\d*|\.\d+)(e[-+]?\d+)?$/i.test(raw);
  el.parentNode.classList.toggle('bad', !ok);
  if (!ok) return;
  s[f.id] = parseFloat(raw) * Q[f.q || 'none'][SYS][1];
  if (f.custom && s[f.custom] !== 'custom') { s[f.custom] = 'custom'; const se = $(`select[data-id="${f.custom}"]`); if (se) se.value = 'custom'; }
  compute();
}
function onSelect(e) {
  const el = e.target; if (el.tagName !== 'SELECT') return;
  const f = fieldList().find(x => x.id === el.dataset.id), s = S[cur];
  s[f.id] = el.value;
  if (f.onChange) f.onChange(s, el.value);
  renderInputs();
  const again = $(`select[data-id="${f.id}"]`); if (again) again.focus();
  compute();
}
let persistT;
function compute() {
  const m = MOD[cur], s = S[cur];
  let R;
  try { R = m.compute(s); } catch (err) { R = newRes(); R.errors.push('Erreur de calcul : ' + err.message); console.error(err); }
  lastRes = R;
  renderResults(R);
  clearTimeout(persistT); persistT = setTimeout(() => store.set('mc.state', S), 300);
}
function renderResults(R) {
  const out = $('#out'), m = MOD[cur];
  const notes = `<div class="card"><div class="card-h"><h3>Hypothèses et limites</h3></div><div class="card-b">${R.formulas.length ? `<div class="formulas">${R.formulas.map(f => `<code>${esc(f)}</code>`).join('')}</div>` : ''}<ul class="notes">${m.notes.map(n => `<li>${esc(n)}</li>`).join('')}</ul></div></div>`;
  if (R.errors.length) {
    out.innerHTML = `<div class="err">Vérifiez les données d'entrée :<ul>${R.errors.map(e => `<li>${esc(e)}</li>`).join('')}</ul></div>` + notes;
    $('#save').disabled = true; return;
  }
  $('#save').disabled = false;
  const kpis = `<div class="kpis">${R.kpis.map(k => `<div class="kpi ${k.tone || ''}"><div class="kl">${esc(k.label)}</div><div class="kv${k.text != null ? ' txt' : ''}">${k.text != null ? esc(k.text) : (isFinite(k.v) ? fmtNum(conv(k.v, k.q)) : '∞') + (unit(k.q) ? `<span class="ku">${unit(k.q)}</span>` : '')}</div><div class="ks">${k.sub || ''}</div></div>`).join('')}</div>`;
  const icon = { ok: '✓', warn: '!', bad: '✕', info: 'i' };
  const checks = `<div class="checks">${R.checks.map(c => `<div class="chk ${c.s}"><span class="dot">${icon[c.s]}</span><span>${c.t}</span></div>`).join('')}</div>`;
  const util = R.util.length ? `<div class="util" style="margin-top:16px">${R.util.map(u => { const r = isFinite(u.r) ? u.r : 9.99; return `<div class="ut-row"><span class="ul">${esc(u.label)}</span><div class="ut-bar"><i class="${tone(r)}" style="width:${Math.min(r, 1) * 100}%"></i></div><span class="uv">${isFinite(u.r) ? fmtNum(u.r * 100, 3) + ' %' : '∞'}</span></div>`; }).join('')}</div>` : '';
  const tables = `<div class="tables">${R.tables.map(t => `<table class="dt"><tbody><tr class="th"><td colspan="2">${esc(t.title)}</td></tr>${t.rows.map(([l, v, q, note]) => `<tr><td>${esc(l)}${note ? `<small>${esc(note)}</small>` : ''}</td><td>${valHTML(v, q)}</td></tr>`).join('')}</tbody></table>`).join('')}</div>`;
  out.innerHTML = kpis +
    `<div class="grid2"><div class="card"><div class="card-h"><h3>Schéma</h3></div><div class="card-b schem">${R.schematic}</div></div>
     <div class="card"><div class="card-h"><h3>Vérifications</h3></div><div class="card-b">${checks}${util}</div></div></div>` +
    R.custom.map(c => `<div class="card"><div class="card-h"><h3>${esc(c.title)}</h3>${c.note ? `<span style="font-size:12px;color:var(--faint)">${esc(c.note)}</span>` : ''}</div><div class="card-b scroll-x">${c.html}</div></div>`).join('') +
    (R.charts.length ? `<div class="card"><div class="card-h"><h3>Graphiques</h3><span style="font-size:12px;color:var(--faint)">Survolez pour lire les valeurs</span></div><div class="card-b charts">${R.charts.map((c, i) => `<div><div class="chart-t">${esc(c.title)}<span>${c.sub || ''}</span></div><div class="chart" id="ch${i}"></div></div>`).join('')}</div></div>` : '') +
    `<div class="card"><div class="card-h"><h3>Résultats détaillés</h3></div><div class="card-b">${tables}</div></div>` + notes;
  R.charts.forEach((c, i) => chart($('#ch' + i), c.o));
}

/* ---------- Historique ---------- */
function saveHistory() {
  if (!lastRes || lastRes.errors.length) return;
  HIST.unshift({ id: Date.now() + '-' + Math.random().toString(36).slice(2, 6), mod: cur, ts: Date.now(), sys: SYS, state: JSON.parse(JSON.stringify(S[cur])), summary: lastRes.summary });
  if (HIST.length > 100) HIST.length = 100;
  store.set('mc.history', HIST); renderNav(); toast('Calcul enregistré dans l\'historique');
}
function renderHistory() {
  $('#title').textContent = 'Historique des calculs';
  $('#desc').textContent = 'Les calculs enregistrés sont conservés dans ce navigateur. Cliquez sur « Ouvrir » pour recharger les données d\'entrée dans le module.';
  const list = HIST.filter(h => histFilter === 'all' || h.mod === histFilter);
  const fmtDate = ts => new Intl.DateTimeFormat('fr-CA', { dateStyle: 'medium', timeStyle: 'short' }).format(new Date(ts));
  $('#view').innerHTML = `<div class="hist-tools">
      <div class="selw"><select id="hf"><option value="all">Tous les modules</option>${MODS.map(m => `<option value="${m.id}"${histFilter === m.id ? ' selected' : ''}>${m.name}</option>`).join('')}</select></div>
      <span style="flex:1"></span>
      <button class="btn" id="hcsv"${HIST.length ? '' : ' disabled'}>Exporter CSV</button>
      <button class="btn" id="hclr"${HIST.length ? '' : ' disabled'}>Tout effacer</button></div>
    <div class="hist">${list.length ? list.map(h => `<div class="card he"><span class="tag">${esc(MOD[h.mod] ? MOD[h.mod].name : h.mod)}</span>
      <div><div class="when">${fmtDate(h.ts)}</div><div class="sum">${(h.summary || []).map(x => `<span>${esc(x.l)} <b>${x.t != null ? esc(x.t) : valTxt(x.v, x.q)}</b></span>`).join('')}</div></div>
      <div class="acts"><button class="btn" data-open="${h.id}">Ouvrir</button><button class="btn icon" data-del="${h.id}" title="Supprimer" aria-label="Supprimer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg></button></div></div>`).join('')
      : `<div class="card empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">${ICON_HIST}</svg><div><b>Aucun calcul enregistré</b></div><div>Utilisez « Enregistrer dans l'historique » dans un module pour conserver un calcul.</div></div>`}</div>`;
  $('#hf').onchange = e => { histFilter = e.target.value; renderHistory(); };
  $('#hclr').onclick = () => { if (confirm('Effacer tout l\'historique ?')) { HIST = []; store.set('mc.history', HIST); renderNav(); renderHistory(); } };
  $('#hcsv').onclick = exportCSV;
  $('#view').querySelector('.hist').addEventListener('click', e => {
    const o = e.target.closest('[data-open]'), d = e.target.closest('[data-del]');
    if (o) { const h = HIST.find(x => x.id === o.dataset.open); if (!h || !MOD[h.mod]) return; S[h.mod] = Object.assign(defaults(MOD[h.mod]), h.state); cur = h.mod; store.set('mc.tab', cur); renderNav(); renderView(); toast('Calcul rechargé'); }
    if (d) { HIST = HIST.filter(x => x.id !== d.dataset.del); store.set('mc.history', HIST); renderNav(); renderHistory(); }
  });
}
function exportCSV() {
  const q = v => '"' + String(v).replace(/"/g, '""') + '"';
  const rows = [['Date', 'Module', 'Résumé'].map(q).join(';')];
  HIST.forEach(h => rows.push([new Date(h.ts).toISOString(), MOD[h.mod] ? MOD[h.mod].name : h.mod, (h.summary || []).map(x => `${x.l} = ${x.t != null ? x.t : valTxt(x.v, x.q)}`).join(' | ')].map(q).join(';')));
  const blob = new Blob(['﻿' + rows.join('\n')], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'mecacalc-historique.csv'; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

$('#view').addEventListener('click', e => {
  const r = e.target.closest('[data-pick]'); if (!r || !MOD[cur]) return;
  S[cur].motor = r.dataset.pick; renderInputs(); compute();
});
$('#view').addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.matches('[data-pick]')) e.target.click(); });
renderNav(); renderUnits(); renderView();
</script>
</body>
